name: Backend Docker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    env:
      DATABASE_URL: postgresql://jobtracker_user:ci_test_password@db:5432/jobtracker
      TEST_DATABASE_URL: postgresql://jobtracker_user:ci_test_password@db:5432/jobtracker_test
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=jobtracker_user
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=jobtracker
          DATABASE_URL=postgresql://jobtracker_user:ci_test_password@db:5432/jobtracker
          TEST_DATABASE_URL=postgresql://jobtracker_user:ci_test_password@db:5432/jobtracker_test
          SECRET_KEY=test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF


      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for Postgres
        run: |
          until docker compose exec -T db pg_isready -U jobtracker_user; do
            sleep 2
          done

      - name: Create test database
        run: |
          docker compose exec -T db psql -U jobtracker_user -d jobtracker -c "CREATE DATABASE jobtracker_test;" || true

      - name: Run migrations
        run: |
          docker compose exec -T backend alembic upgrade head

      - name: Run tests
        run: |
          docker compose exec -T backend sh -c "PYTHONPATH=. pytest"

      - name: Stop containers
        if: always()
        run: docker compose down -v